name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows x64 release
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: dist-multi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          rm -rf "$PUBLISH_DIR"
          VERSION_FULL="${TAG#v}"
          NUMERIC=$(printf '%s' "$VERSION_FULL" | grep -oE '^[0-9]+(\.[0-9]+){0,3}' | head -n 1)
          if [ -z "$NUMERIC" ]; then NUMERIC="0.0.0"; fi
          dotnet publish NfcBridgeApp/NfcBridgeApp.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:Version="$NUMERIC" \
            -p:InformationalVersion="$VERSION_FULL" \
            -o "$PUBLISH_DIR"

      - name: Verify publish output
        shell: bash
        run: |
          test -f "$PUBLISH_DIR/NfcBridgeApp.exe"
          test -f "$PUBLISH_DIR/NfcBridgeApp.pdb"
          test -f "$PUBLISH_DIR/NfcBridgeApp.dll"
          test -f "$PUBLISH_DIR/NfcBridgeApp.deps.json"
          test -f "$PUBLISH_DIR/NfcBridgeApp.runtimeconfig.json"

      - name: Package release zip
        id: package
        shell: bash
        run: |
          safe_tag="${GITHUB_REF_NAME//\//-}"
          zip_name="NfcBridgeApp-win-x64-${safe_tag}.zip"
          (cd "$PUBLISH_DIR" && zip -r "../${zip_name}" .)
          unzip -l "$zip_name" | grep -q 'NfcBridgeApp.exe'
          unzip -l "$zip_name" | grep -q 'NfcBridgeApp.pdb'
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Windows x64 multi-file publish build for ${GITHUB_REF_NAME}. Download the attached ${ZIP_NAME}; GitHub's automatically generated source code zip does not contain build output."
          fi
